name: Deploy to Production (ghcc.pinnacletechhub.com.ng)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: "82.25.113.81"
  DEPLOY_PORT: "65002"
  DEPLOY_URL:  "https://ghcc.pinnacletechhub.com.ng"
  # --- Hostinger paths (account u572560474) ---
  DOC_ROOT:     /home/u572560474/domains/pinnacletechhub.com.ng/public_html/__ghcc
  BACKUP_ROOT:  /home/u572560474/deploy/ghcc/backups

jobs:
  build:
    name: Build artefact
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release
        run: |
          TAG="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Install PHP dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.2"
          args: --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies & build CSS
        run: |
          npm ci
          npm run build:css

      - name: Sanitize build (remove dev tools & scripts)
        run: |
          rm -rf node_modules
          rm -rf .deploy_keys
          rm -f .env.*
          rm -f package.json package-lock.json
          rm -f tailwind.config.js
          rm -f composer.json composer.lock

      - name: Remove setup / seed / one-off scripts from artifact
        run: |
          rm -f  add_slug_to_events.php check_events_table.php fix_password.php \
                 seed_*.php update_password.php \
                 PRODUCTION_CHECKLIST.md README.md
          # NOTE: setup_*.php and update_db.php are kept — needed for migrations,
          # and are blocked from web access by .htaccess.

      - name: Ensure writable directories exist in release
        run: |
          mkdir -p logs
          mkdir -p assets/uploads/sermons/audio
          mkdir -p assets/logo

      - name: Package deploy tree
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='_deploy' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.deploy_keys' \
            --exclude='.env' \
            ./ _deploy/
          tar -C _deploy -czf ghcc-release-${{ steps.release.outputs.tag }}.tar.gz .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ghcc-release-${{ steps.release.outputs.tag }}
          path: ghcc-release-${{ steps.release.outputs.tag }}.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghcc.pinnacletechhub.com.ng
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: ghcc-release-${{ needs.build.outputs.release_tag }}

      - name: Configure SSH (key + known_hosts)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write key, stripping CR (Windows paste) and guaranteeing a trailing newline.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate the key parses before we try to use it.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY is not a valid OpenSSH key. Re-paste the FULL key including the BEGIN/END lines (no extra spaces, no CRLF).'
            exit 1
          fi
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS secret not set — scanning host key on the runner."
            # Retry the scan: ssh-keyscan can transiently return non-zero / empty
            # against a non-standard port. Do not let a single failure abort the step.
            : > ~/.ssh/known_hosts
            for attempt in 1 2 3 4 5; do
              ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519,ecdsa-sha2-nistp256,rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
              if [ -s ~/.ssh/known_hosts ]; then
                echo "Host key captured on attempt $attempt."
                break
              fi
              echo "Scan attempt $attempt produced no key — retrying in 5s."
              sleep 5
            done
          fi
          chmod 644 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo '::error::known_hosts is empty — the runner could not fetch the host key.'
            echo '::error::Fix: add the SSH_KNOWN_HOSTS repo secret. Generate it locally (or from any machine that can reach the host) with:'
            echo "::error::  ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST"
            exit 1
          fi

      - name: Extract artefact on runner
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          mkdir -p _tree
          tar -xzf "ghcc-release-${TAG}.tar.gz" -C _tree
          # Ensure a trailing slash-friendly source directory.
          ls -la _tree

      - name: Backup current site on host
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG:      ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            mkdir -p '$BACKUP_ROOT'
            mkdir -p '$DOC_ROOT'
            # Ensure persistent, user-owned content dirs exist so rsync excludes protect them.
            mkdir -p '$DOC_ROOT/logs' '$DOC_ROOT/assets/uploads/sermons/audio' '$DOC_ROOT/assets/logo'
            # Back up code (exclude bulky/user content) so a rollback can restore it.
            if [ -n \"\$(ls -A '$DOC_ROOT' 2>/dev/null)\" ]; then
              tar -czf '$BACKUP_ROOT/backup-$TAG.tar.gz' \
                  -C '$DOC_ROOT' \
                  --exclude='assets/uploads' \
                  --exclude='logs' \
                  . || echo '::warning::Backup archive step reported an issue; continuing.'
            fi
            # Retention: keep only the newest 5 backups.
            cd '$BACKUP_ROOT'
            ls -1t backup-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
          "

      - name: Deploy via rsync (into docroot, preserving .env & uploads)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            --exclude='.env' \
            --exclude='/assets/uploads/' \
            --exclude='/assets/logo/' \
            --exclude='/logs/' \
            _tree/ "$SSH_USER@$DEPLOY_HOST:$DOC_ROOT/"

      - name: Verify config + run idempotent DB migrations
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DOC_ROOT'
            php -r \"require 'config/config.php'; new App\\\\Core\\\\Database();\" \
              && echo 'PHP + DB config loads OK'
            [ -f setup_roles_superadmin_branch_admin.php ] && php setup_roles_superadmin_branch_admin.php || true
            [ -f setup_multibranch_schema.php ]   && php setup_multibranch_schema.php   || true
            [ -f setup_registration_schema.php ]  && php setup_registration_schema.php  || true
            [ -f setup_registration_schema_v2.php ] && php setup_registration_schema_v2.php || true
            [ -f setup_team_schema.php ]          && php setup_team_schema.php          || true
            [ -f update_db.php ]                  && php update_db.php                  || true
            echo 'DB migrations completed.'
          "

      - name: Post-deploy smoke check
        run: |
          curl -fsSI -o /dev/null --max-time 25 "$DEPLOY_URL/" \
            && echo 'Site responded OK' \
            || echo '::warning::Post-deploy smoke check did not return OK — check the live site.'

      - name: Summary
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "## Deployment succeeded :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ needs.build.outputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Host: \`$SSH_USER@$DEPLOY_HOST:$DEPLOY_PORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docroot: \`$DOC_ROOT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback via: Actions -> Rollback Production -> Run workflow" >> "$GITHUB_STEP_SUMMARY"
