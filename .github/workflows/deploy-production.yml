name: Deploy to Production (ghcc.pinnacletechhub.com.ng)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_keep_count:
        description: 'Number of old releases to keep after deploy'
        required: false
        default: '5'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: "82.25.113.81"
  DEPLOY_PORT: "65002"
  DEPLOY_URL:  "https://ghcc.pinnacletechhub.com.ng"
  # --- Hostinger paths (account u572560474) ---
  DEPLOY_BASE:  /home/u572560474/deploy/ghcc
  RELEASES_ROOT: /home/u572560474/deploy/ghcc/releases
  SHARED_ROOT:   /home/u572560474/deploy/ghcc/shared
  CURRENT_LINK:  /home/u572560474/deploy/ghcc/current
  DOC_ROOT:      /home/u572560474/domains/pinnacletechhub.com.ng/public_html/__ghcc

jobs:
  build:
    name: Build artefact
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release
        run: |
          TAG="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "tag=$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Install PHP dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.2"
          args: --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies & build CSS
        run: |
          npm ci
          npm run build:css

      - name: Sanitize build (remove dev tools & scripts)
        run: |
          rm -rf node_modules
          rm -rf .deploy_keys
          rm -f .env.*
          rm -f package.json package-lock.json
          rm -f tailwind.config.js
          rm -f composer.json composer.lock

      - name: Remove setup / seed / one-off scripts from artifact
        run: |
          rm -f  add_slug_to_events.php check_events_table.php fix_password.php \
                 seed_*.php update_password.php \
                 PRODUCTION_CHECKLIST.md README.md
          # NOTE: setup_*.php and update_db.php are kept — needed for migrations,
          # and are blocked from web access by .htaccess.

      - name: Ensure writable directories exist in release
        run: |
          mkdir -p logs
          mkdir -p assets/uploads/sermons/audio
          mkdir -p assets/logo

      - name: Package release artefact
        run: |
          mkdir -p _release/${{ steps.release.outputs.tag }}
          rsync -a \
            --exclude='_release' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.deploy_keys' \
            --exclude='.env' \
            ./ _release/${{ steps.release.outputs.tag }}/
          tar -C _release -czf ghcc-release-${{ steps.release.outputs.tag }}.tar.gz .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ghcc-release-${{ steps.release.outputs.tag }}
          path: ghcc-release-${{ steps.release.outputs.tag }}.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghcc.pinnacletechhub.com.ng
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: ghcc-release-${{ needs.build.outputs.release_tag }}

      - name: Configure SSH (key + known_hosts)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write key, stripping CR (Windows paste) and guaranteeing a trailing newline.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate the key parses before we try to use it.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY is not a valid OpenSSH key. Re-paste the FULL key including the BEGIN/END lines (no extra spaces, no CRLF).'
            exit 1
          fi
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS secret not set — scanning host key on the runner."
            ssh-keyscan -p "$DEPLOY_PORT" -t ed25519,ecdsa-sha2-nistp256,rsa "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo '::error::known_hosts is empty — cannot verify host.'; exit 1; }

      - name: Prepare directories on host
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG:      ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            mkdir -p '$RELEASES_ROOT' '$SHARED_ROOT/logs' '$SHARED_ROOT/assets/uploads/sermons/audio' '$SHARED_ROOT/assets/logo'
            mkdir -p \"\$(dirname '$DOC_ROOT')\"
            touch '$SHARED_ROOT/.env'
            chmod 600 '$SHARED_ROOT/.env'
          "

      - name: Upload release
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG:      ${{ needs.build.outputs.release_tag }}
        run: |
          scp -P "$DEPLOY_PORT" -o BatchMode=yes "ghcc-release-${TAG}.tar.gz" "$SSH_USER@$DEPLOY_HOST:/tmp/ghcc-release-${TAG}.tar.gz"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            mkdir -p '$RELEASES_ROOT/$TAG'
            tar -xzf '/tmp/ghcc-release-${TAG}.tar.gz' -C '$RELEASES_ROOT/$TAG'
            rm -f '/tmp/ghcc-release-${TAG}.tar.gz'
          "

      - name: Symlink shared storage into new release
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG:      ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            R='$RELEASES_ROOT/$TAG'
            # Ensure parent directories exist in the release before symlinking.
            mkdir -p \"\$R/logs\" \"\$R/assets\"
            rm -rf   \"\$R/.env\" \"\$R/logs\" \"\$R/assets/uploads\" \"\$R/assets/logo\"
            ln -sfn  '$SHARED_ROOT/.env'           \"\$R/.env\"
            ln -sfn  '$SHARED_ROOT/logs'           \"\$R/logs\"
            ln -sfn  '$SHARED_ROOT/assets/uploads' \"\$R/assets/uploads\"
            ln -sfn  '$SHARED_ROOT/assets/logo'    \"\$R/assets/logo\"
            php -r \"require '\$R/config/config.php'; new App\Core\Database();\" \
              && echo 'PHP + DB config loads OK'
          "

      - name: Run idempotent DB migrations (from NEW release)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG:      ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            R='$RELEASES_ROOT/$TAG'
            cd \"\$R\"
            [ -f setup_roles_superadmin_branch_admin.php ] && php setup_roles_superadmin_branch_admin.php || true
            [ -f setup_multibranch_schema.php ]   && php setup_multibranch_schema.php   || true
            [ -f setup_registration_schema.php ]  && php setup_registration_schema.php  || true
            [ -f setup_registration_schema_v2.php ] && php setup_registration_schema_v2.php || true
            [ -f setup_team_schema.php ]          && php setup_team_schema.php          || true
            [ -f update_db.php ]                  && php update_db.php                  || true
            echo 'DB migrations completed.'
          "

      - name: Atomic swap (current -> new release) + wire docroot
        env:
          SSH_USER:       ${{ secrets.SSH_USER }}
          TAG:            ${{ needs.build.outputs.release_tag }}
          KEEP:           ${{ github.event.inputs.release_keep_count || '5' }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            TARGET='$RELEASES_ROOT/$TAG'
            # Atomic symlink replace via mv
            ln -sfn \"\$TARGET\" '$CURRENT_LINK.new'
            mv -fT  '$CURRENT_LINK.new' '$CURRENT_LINK'
            # Wire the Hostinger subdomain docroot to the active release.
            # If public_html already exists as a real directory, back it up once.
            if [ -e '$DOC_ROOT' ] && [ ! -L '$DOC_ROOT' ]; then
              mv '$DOC_ROOT' '${DOC_ROOT}.bak-$TAG'
            fi
            ln -sfn '$CURRENT_LINK' '$DOC_ROOT'
            # Post-deploy smoke check
            curl -fsSI -o /dev/null --max-time 25 '$DEPLOY_URL/' \
              && echo 'Site responded OK after swap' \
              || (echo '::warning::Post-deploy smoke check did not return OK — check live site.'; true)
            # Retention: keep only the newest N releases
            cd '$RELEASES_ROOT'
            ls -1t | tail -n +\$((KEEP+1)) | xargs -r -I{} rm -rf {}
          "

      - name: Summary
        run: |
          echo "## Deployment succeeded :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ needs.build.outputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Host: \`$SSH_USER@$DEPLOY_HOST:$DEPLOY_PORT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback via: Actions -> Rollback Production -> Run workflow" >> "$GITHUB_STEP_SUMMARY"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
