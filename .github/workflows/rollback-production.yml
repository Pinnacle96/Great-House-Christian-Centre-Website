name: Rollback Production (ghcc.pinnacletechhub.com.ng)

on:
  workflow_dispatch:
    inputs:
      backup:
        description: >
          Backup file name to restore FROM (e.g. backup-20260804-101530-abcdef.tar.gz).
          Leave blank = restore the most recent backup taken before the last deploy.
        required: false
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: "82.25.113.81"
  DEPLOY_PORT: "65002"
  DEPLOY_URL:  "https://ghcc.pinnacletechhub.com.ng"
  DOC_ROOT:     /home/u572560474/domains/pinnacletechhub.com.ng/public_html/__ghcc
  BACKUP_ROOT:  /home/u572560474/deploy/ghcc/backups

jobs:
  rollback:
    name: Restore from backup
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghcc.pinnacletechhub.com.ng
    steps:
      - name: Configure SSH (key + known_hosts)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write key, stripping CR (Windows paste) and guaranteeing a trailing newline.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Validate the key parses before we try to use it.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY is not a valid OpenSSH key. Re-paste the FULL key including the BEGIN/END lines (no extra spaces, no CRLF).'
            exit 1
          fi
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS secret not set — scanning host key on the runner."
            # Retry the scan: ssh-keyscan can transiently return non-zero / empty
            # against a non-standard port. Do not let a single failure abort the step.
            : > ~/.ssh/known_hosts
            for attempt in 1 2 3 4 5; do
              ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519,ecdsa-sha2-nistp256,rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
              if [ -s ~/.ssh/known_hosts ]; then
                echo "Host key captured on attempt $attempt."
                break
              fi
              echo "Scan attempt $attempt produced no key — retrying in 5s."
              sleep 5
            done
          fi
          chmod 644 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo '::error::known_hosts is empty — the runner could not fetch the host key.'
            echo '::error::Fix: add the SSH_KNOWN_HOSTS repo secret. Generate it locally (or from any machine that can reach the host) with:'
            echo "::error::  ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST"
            exit 1
          fi

      - name: Resolve backup to restore
        id: target
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          WANTED:   ${{ github.event.inputs.backup }}
        run: |
          if [ -n "$WANTED" ]; then
            FILE="$WANTED"
            ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "[ -f '$BACKUP_ROOT/$FILE' ]" \
              || { echo "::error::Requested backup '$FILE' not found under $BACKUP_ROOT/ on host"; exit 1; }
          else
            FILE=$(ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
              set -euo pipefail
              ls -1t '$BACKUP_ROOT'/backup-*.tar.gz 2>/dev/null | head -n 1 | xargs -r basename
            ")
            [ -n "$FILE" ] || { echo "::error::No backup archive found to restore from."; exit 1; }
          fi
          echo "file=$FILE" | tee -a "$GITHUB_OUTPUT"

      - name: Restore backup into docroot (preserving .env & uploads)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          FILE:     ${{ steps.target.outputs.file }}
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$SSH_USER@$DEPLOY_HOST" "
            set -euo pipefail
            ARCHIVE='$BACKUP_ROOT/$FILE'
            [ -f \"\$ARCHIVE\" ] || { echo 'Backup archive missing'; exit 1; }
            cd '$DOC_ROOT'
            # Remove current code but keep persistent content (.env, uploads, logs).
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name 'assets' \
              ! -name 'logs' \
              -exec rm -rf {} +
            # assets/ is kept, but its code subdirs will be overwritten by extract; uploads/logo survive.
            tar -xzf \"\$ARCHIVE\" -C '$DOC_ROOT'
            curl -fsSI -o /dev/null --max-time 25 '$DEPLOY_URL/' \
              && echo 'Rollback smoke check passed.' \
              || (echo '::warning::Rollback smoke check did not return OK — investigate immediately.'; true)
          "

      - name: Summary
        run: |
          echo "## Rollback complete :rewind:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restored from backup: \`${{ steps.target.outputs.file }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo ">" >> "$GITHUB_STEP_SUMMARY"
          echo "> Reminder: this reverts CODE/ASSETS only (.env & uploads are preserved). To revert DATABASE state, restore the DB backup taken before the bad deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "> Schema changes here are additive/idempotent, but DDL is not auto-reversible." >> "$GITHUB_STEP_SUMMARY"
